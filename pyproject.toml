[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitea-mcp"
version = "0.1.0"
description = "A local MCP server for Gitea — talks directly to your own instance, no hosted gateway in between."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "mcp==1.9.4",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
gitea-mcp = "gitea_mcp:main"

[project.urls]
Repository = "https://github.com/datamathcode/gitea-mcp"

[tool.hatch.build.targets.wheel]
include = ["gitea_mcp.py"]
